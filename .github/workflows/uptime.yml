name: Uptime Monitor

# Comprueba cada ~10 min que los sitios en producción responden 200.
# Si un sitio no responde tras varios reintentos:
#   1. Abre una incidencia en [AKS] - Incidencias (idempotente, sin duplicar).
#   2. Falla el job → GitHub envía email al responsable del repo.
# Ejecutable también a mano desde la pestaña Actions (workflow_dispatch).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Web Activos Kairos"
            url: "https://activoskairos.com"
          - name: "Portal Rumbo"
            url: "https://rumbo.activoskairos.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Comprobar ${{ matrix.name }}
        id: probe
        env:
          SITE_URL: ${{ matrix.url }}
        run: |
          echo "Comprobando $SITE_URL ..."
          code="000"
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0 (UptimeMonitor)" "$SITE_URL" || echo "000")
            echo "  intento $i → HTTP $code"
            case "$code" in 2*|3*) break;; esac
            sleep 15
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ !startsWith(steps.probe.outputs.code, '2') && !startsWith(steps.probe.outputs.code, '3') }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Abrir incidencia en Notion
        if: ${{ !startsWith(steps.probe.outputs.code, '2') && !startsWith(steps.probe.outputs.code, '3') }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_INCIDENCIAS_DB: ${{ secrets.NOTION_INCIDENCIAS_DB }}
          SITE_NAME: ${{ matrix.name }}
          SITE_URL: ${{ matrix.url }}
          HTTP_CODE: ${{ steps.probe.outputs.code }}
        run: node scripts/notion-incident.mjs

      - name: Fallar si el sitio no responde
        if: ${{ !startsWith(steps.probe.outputs.code, '2') && !startsWith(steps.probe.outputs.code, '3') }}
        run: |
          echo "::error::${{ matrix.name }} no responde (HTTP ${{ steps.probe.outputs.code }})"
          exit 1
