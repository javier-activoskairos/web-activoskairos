name: Deploy & Notion Sync

# En cada push a main:
#   1. Dispara el deploy en el VPS (EasyPanel deploy webhook).
#   2. Espera a que la imagen NUEVA esté sirviendo (sello de /api/version), no
#      solo a que la home dé 200: mientras EasyPanel construye, el contenedor
#      viejo sigue respondiendo 200 y el check antiguo daba OK sin desplegar nada.
#   3. Sincroniza el estado a Notion (Fábrica de Webs): [AKS] - Webs (Entorno=VPS)
#      + alta de despliegue en [AKS] - Despliegues con el resultado.
# También ejecutable a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy detrás de otro, nunca solapados. EasyPanel mata («killed») el build
# en curso cuando le llega otro deploy del mismo servicio, y el corte puede
# tumbar también el build nuevo (comparten el builder de Docker): con dos merges
# seguidos a main se quedaba sin desplegar ninguno (21/09/2026, PRs #9 y #11).
# Sin cancel-in-progress, el run nuevo espera a que el anterior termine; GitHub
# solo guarda un run pendiente por grupo, así que el último push siempre llega.
concurrency:
  group: deploy-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      SITE_URL: "https://activoskairos.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Leer la versión que está sirviendo
        id: before
        run: |
          # 404 (versiones sin /api/version) o error de red → "ninguna".
          prev=$(curl -s -f --max-time 20 -A "Mozilla/5.0 (GitHubActions)" "$SITE_URL/api/version" || echo "ninguna")
          echo "Versión actual: $prev"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Disparar deploy en el VPS (EasyPanel)
        if: ${{ env.EASYPANEL_DEPLOY_URL != '' }}
        run: |
          echo "Disparando deploy en EasyPanel..."
          code=$(curl -s -o /tmp/deploy.out -w "%{http_code}" -X POST             -A "Mozilla/5.0 (GitHubActions) Chrome/126.0"             -H "Content-Type: application/json" -d '{}'             "$EASYPANEL_DEPLOY_URL")
          echo "HTTP $code — $(cat /tmp/deploy.out)"
          if [ "$code" != "200" ]; then
            echo "El webhook de deploy no devolvió 200"; exit 1
          fi

      - name: Esperar a que la versión nueva esté sirviendo
        id: health
        env:
          PREV: ${{ steps.before.outputs.prev }}
        run: |
          # Un build normal tarda ~4 min (nix ~2 min + npm install + next build).
          # Si a los 8 min sigue la versión vieja, el build ha muerto por algo
          # transitorio (p. ej. ghcr.io cortando la descarga de la imagen base de
          # nixpacks): se vuelve a disparar UNA vez. Tope total: 16 min.
          result="FALLO"
          reintentado="no"
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            # Sin webhook no se ha desplegado nada: solo se comprueba que el sitio vive.
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "$SITE_URL" || echo "000")
            [ "$home" = "200" ] && result="OK"
            echo "result=$result" >> "$GITHUB_OUTPUT"; echo "Sin EASYPANEL_DEPLOY_URL · home HTTP $home"; exit 0
          fi
          for i in $(seq 1 96); do
            now=$(curl -s -f --max-time 20 -A "Mozilla/5.0 (GitHubActions)" "$SITE_URL/api/version" || echo "ninguna")
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "$SITE_URL" || echo "000")
            echo "  intento $i → versión $now · home HTTP $home"
            if [ "$now" != "ninguna" ] && [ "$now" != "$PREV" ] && [ "$home" = "200" ]; then
              result="OK"; break
            fi
            if [ "$i" = "48" ] && [ "$reintentado" = "no" ] && [ -n "$EASYPANEL_DEPLOY_URL" ]; then
              echo "::warning::Sin versión nueva a los 8 min: se vuelve a disparar el deploy una vez."
              curl -s -o /dev/null -X POST -A "Mozilla/5.0 (GitHubActions) Chrome/126.0"                 -H "Content-Type: application/json" -d '{}' "$EASYPANEL_DEPLOY_URL" || true
              reintentado="sí"
            fi
            sleep 10
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Resultado: $result (reintento: $reintentado)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sincronizar a Notion
        env:
          # Secrets en Settings → Secrets and variables → Actions.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }} # integración "GitHub Actions Webs y Despliegues"
          NOTION_WEBS_DB: ${{ secrets.NOTION_WEBS_DB }} # [AKS] - Webs/Repos
          NOTION_DEPLOYS_DB: ${{ secrets.NOTION_DEPLOYS_DB }} # [AKS] - Despliegues
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.event.repository.html_url }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          DEPLOY_URL: "https://activoskairos.com"
          DEPLOY_RESULT: ${{ steps.health.outputs.result }}
        run: node scripts/notion-sync.mjs

      - name: Fallar si la versión nueva no llegó a servir
        if: ${{ steps.health.outputs.result != 'OK' }}
        run: |
          echo "::error::El deploy no llegó a producción: revisar la acción en EasyPanel (proyecto webs, servicio activoskairos)."
          exit 1
